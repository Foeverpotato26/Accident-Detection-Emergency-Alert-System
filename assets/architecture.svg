<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" font-family="Arial, Helvetica, sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="550" y="32" font-size="22" text-anchor="middle" fill="#111" font-weight="bold">System architecture</text><rect x="40" y="120" width="220" height="70" rx="8" fill="#dbeafe" stroke="#334155" stroke-width="2"/><text x="150" y="142" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">MPU6050</text><text x="150" y="160" font-size="11" text-anchor="middle" fill="#475569">acceleration + rotation</text><rect x="40" y="230" width="220" height="70" rx="8" fill="#dcfce7" stroke="#334155" stroke-width="2"/><text x="150" y="252" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">NEO-6M GPS</text><text x="150" y="270" font-size="11" text-anchor="middle" fill="#475569">latitude / longitude</text><rect x="40" y="340" width="220" height="70" rx="8" fill="#fee2e2" stroke="#334155" stroke-width="2"/><text x="150" y="362" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">SOS button</text><text x="150" y="380" font-size="11" text-anchor="middle" fill="#475569">manual alert</text><rect x="380" y="200" width="200" height="110" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="480" y="222" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">ESP32</text><text x="480" y="240" font-size="11" text-anchor="middle" fill="#475569">detection logic + LEDs</text><rect x="380" y="350" width="200" height="60" rx="8" fill="#fef3c7" stroke="#334155" stroke-width="2"/><text x="480" y="372" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">Red / Green LEDs</text><text x="480" y="390" font-size="11" text-anchor="middle" fill="#475569">status indicators</text><rect x="700" y="200" width="160" height="110" rx="8" fill="#ffedd5" stroke="#334155" stroke-width="2"/><text x="780" y="222" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">Wi-Fi</text><text x="780" y="240" font-size="11" text-anchor="middle" fill="#475569">HTTPS REST (PUT / POST)</text><rect x="700" y="360" width="160" height="110" rx="8" fill="#fde68a" stroke="#334155" stroke-width="2"/><text x="780" y="382" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">Firebase</text><text x="780" y="400" font-size="11" text-anchor="middle" fill="#475569">Realtime Database + Auth</text><rect x="380" y="520" width="200" height="110" rx="8" fill="#c7d2fe" stroke="#334155" stroke-width="2"/><text x="480" y="542" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">Web dashboard</text><text x="480" y="560" font-size="11" text-anchor="middle" fill="#475569">HTML / CSS / JS (GitHub Pages)</text><polyline points="260,155 320,155 320,240 380,240" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round"/><polyline points="260,265 380,265" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round"/><polyline points="260,375 320,375 320,290 380,290" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round"/><polyline points="580,255 700,255" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round"/><polyline points="780,310 780,360" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round"/><polyline points="700,415 640,415 640,575 580,575" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round"/><polyline points="480,310 480,350" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round"/><text x="780" y="495" font-size="11" text-anchor="middle" fill="#111">read: /accidentAlert/current + /history</text><text x="640" y="560" font-size="11" text-anchor="middle" fill="#111">polling every 2 s</text><text x="760" y="185" font-size="11" text-anchor="middle" fill="#111">3 s upload / on alert</text><text x="780" y="345" font-size="1" text-anchor="start" fill="#111"></text><text x="150" y="100" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">Sensors &amp; inputs</text><text x="550" y="686" font-size="12" text-anchor="middle" fill="#64748b">MPU6050 + GPS + SOS button → ESP32 → Wi-Fi → Firebase Realtime Database → Web dashboard</text></svg>